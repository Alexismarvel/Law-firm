<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Inter:wght@400;500;600&amp;display=swap');
    </style>
  </defs>

  <!-- Scale icon -->
  <g transform="translate(18, 10)">
    <!-- Base triangle -->
    <line x1="30" y1="8" x2="30" y2="38" stroke="#53917E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="42" r="5" fill="none" stroke="#53917E" stroke-width="2"/>
    <!-- Beam -->
    <line x1="5" y1="20" x2="55" y2="20" stroke="#53917E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left pan strings -->
    <line x1="5" y1="20" x2="12" y2="36" stroke="#53917E" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="20" x2="8" y2="36" stroke="#53917E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Right pan strings -->
    <line x1="55" y1="20" x2="48" y2="36" stroke="#53917E" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="55" y1="20" x2="52" y2="36" stroke="#53917E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left pan -->
    <path d="M5,36 Q10,44 16,36" fill="none" stroke="#53917E" stroke-width="2" stroke-linecap="round"/>
    <!-- Right pan -->
    <path d="M44,36 Q50,44 55,36" fill="none" stroke="#53917E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Firm name -->
  <text x="92" y="52" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#020202" letter-spacing="0.5">Marvel &amp; Associates</text>

  <!-- Divider line -->
  <line x1="92" y1="65" x2="310" y2="65" stroke="#53917E" stroke-width="2"/>

  <!-- Tagline -->
  <text x="92" y="84" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#53917E" letter-spacing="4" text-transform="uppercase">Attorneys at Law</text>
</svg>
